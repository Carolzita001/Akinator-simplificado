<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akinator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
   <div class="container">
        <h1>Akinator</h1>

        <div class="genio-container">
            <img id="genio-img" src="imagens/genio.png" alt="Akinator">
        </div>

        <div id="pergunta-box">
            <p id="texto-exibido">Carregando...</p>
        </div>
    
        <div class="botoes">
            <button id="btn-iniciar">Começar Jogo</button>
            <button id="btn-sim" class="btn-resposta">Sim</button>
            <button id="btn-nao" class="btn-resposta">Não</button>
            <button id="btn-reiniciar" class="btn-acao">Jogar Novamente</button>
        </div>
    </div>


    <script src="script.js" defer></script>
</body>
</html>
